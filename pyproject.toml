[project]
name = "docuquest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "pydantic-settings>=2.5", "python-multipart>=0.0.9", "passlib[bcrypt]>=1.7", "bcrypt<4.1.0", "PyJWT>=2.9", "pymupdf>=1.24", "pillow>=10", "pytesseract>=0.3.13", "celery>=5.4", "redis>=5", "psycopg[binary]>=3.2", "alembic>=1.13", "email-validator>=2", "boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
