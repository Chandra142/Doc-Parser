services:
  - type: web
    name: docuquest
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CELERY_EAGER
        value: "true"
      - key: DATABASE_URL
        value: "sqlite:///./docuquest.db"
      - key: JWT_SECRET
        generateValue: true
      - key: OCR_PROVIDER
        value: "tesseract"
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"
